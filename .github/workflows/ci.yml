name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m semadapt.train --smoke --epochs 1 --out runs/ci
      - run: uv run python -m semadapt.predict --checkpoint runs/ci/lora-7 --text 'track my order'
      - run: uv run python -m build
